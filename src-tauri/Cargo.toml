[workspace]
members = ["."]
resolver = "2"

[package]
name = "wordbuddy"
version = "0.1.0"
description = "Privacy-first system-wide writing assistant"
authors = ["Frostbite1536"]
license = "LicenseRef-Proprietary"
edition = "2021"

[lib]
name = "wordbuddy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri core
# tray-icon: system tray presence so the hidden bar has a visible
# affordance (minimize-to-tray; Ctrl+Shift+S still works).
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-shell = "2"
# tauri-plugin-updater removed pending real signing-key wiring; see
# docs/base-archive/docs/base-archive/PRODUCTION_READINESS.md §Auto-update for the re-enable checklist.
tauri-plugin-process = "2"
# Local crash + diagnostic logging (O1 / PRINCIPLES.md §97). Writes to
# the OS-conventional app_log_dir; rotates at 5 MB per file. NO network
# uploads — the principles ban error-reporting SDKs. Settings →
# Diagnostics gives the user "Open log directory" / "Copy last 5 MB".
tauri-plugin-log = "2"
log = "0.4"

# Direct pin to force a patched sqlx through tauri-plugin-sql's transitive
# pin. RUSTSEC-2024-0363: sqlx <0.8.1 misinterprets binary-protocol arg
# lengths >4 GiB as separate statements (effective SQL injection through
# bindings). Practical exploitability is very low here (our largest
# bound value is QUEUE_SIZE_CAP_BYTES = 10 MB), but cargo audit flags it
# and the patched version is a drop-in.
sqlx = "=0.8.2"

# HTTP + streaming
reqwest = { version = "0.12", features = ["json", "stream", "multipart"] }
futures-util = "0.3"
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# SQLite direct access (writing analytics DB, PLAN-05; pattern from the
# base repo's journal/db.rs)
# Pinned to a version whose libsqlite3-sys major matches sqlx's pin
# (both link to sqlite3, so cargo's `links` constraint requires one
# version site-wide). sqlx 0.8.2 → libsqlite3-sys 0.30 → rusqlite 0.32+.
rusqlite = { version = "0.32", features = ["bundled"] }

# Local-first grammar checking (PLAN-01; Apache-2.0, copyleft-free).
# `concurrent` switches harper internals to Arc so the engine is usable
# from tokio contexts without Rc crossing an await point.
harper-core = { version = "2.8", features = ["concurrent"] }
sha2 = "0.10"

# OS-vault secret storage (audit M13): Windows Credential Manager,
# macOS Keychain, Linux Secret Service. One API across all three
# targets so the linux/macos ports need no storage rework.
keyring = { version = "3.6", features = [
    "windows-native",
    "apple-native",
    "sync-secret-service",
] }

# Utilities
dirs-next = "2.0"
getrandom = "0.2"

# Windows API for native window title detection (replaces PowerShell spawn)
# + UI Automation for pixel-precise accessibility-powered element detection
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
    # text_monitor: PID -> process image name for exclusion keys
    "Win32_System_Threading",
    # analytics: local-timezone offset for day bucketing
    "Win32_System_Time",
    # PLAN-04 clipboard save/restore + synthetic paste/copy
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_UI_Input_KeyboardAndMouse",
] }
uiautomation = "0.24"

# macOS accessibility API: `accessibility-sys` for AXIsProcessTrusted()
# (permission gate) and raw AXValue decoding; `accessibility` wraps the
# AXUIElement tree walk; core-foundation/core-graphics cover CFString/
# CFType/CGPoint interop used by a11y and the CGEvent paste path.
[target.'cfg(target_os = "macos")'.dependencies]
accessibility = "0.2"
accessibility-sys = "0.2"
core-foundation = "0.10"
core-graphics = "0.24"

# Clipboard save/restore for macOS/Linux paste applies (text-only v1 —
# see clipboard.rs for the documented format-loss tradeoff).
[target.'cfg(not(target_os = "windows"))'.dependencies]
arboard = "3"

# Linux AT-SPI2 (D-Bus accessibility)
[target.'cfg(target_os = "linux")'.dependencies]
atspi = "0.29"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# Release-build tuning (O9 audit). Targets: smaller binary
# (faster Defender / Gatekeeper / SmartScreen scans, faster
# install, smaller download), faster cold start. The trade-off
# is longer compile time on a release build — acceptable for
# CI but felt locally if anyone runs `cargo build --release`.
#
# - lto = "fat":     cross-crate inlining, ~10-25% size reduction.
# - codegen-units=1: single codegen unit gives the most LTO leverage.
# - opt-level = "z": optimize for size over speed; the hot paths
#                    are already async I/O bound, not CPU.
# - strip = "symbols": remove debug symbols from the shipped binary.
# - panic = "abort": skip unwinding tables; smaller binary, and
#                    panics during release have nothing useful to
#                    unwind to anyway (nothing catches them today).
[profile.release]
lto = "fat"
codegen-units = 1
opt-level = "z"
strip = "symbols"
panic = "abort"

# Keep dev builds snappy — none of the size/perf tradeoffs above
# matter for `cargo build` during development.
[profile.dev]
opt-level = 0

[dev-dependencies]
# Used by diagnostics::tests — every test creates a temp directory
# for a fake log file so the assertions don't touch the real
# app_log_dir.
tempfile = "3"
