name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            target: linux
          - platform: macos-latest
            target: macos
          - platform: windows-latest
            target: windows

    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch pin
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - name: Install system dependencies (Linux)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libxdo-dev \
            libasound2-dev \
            libpipewire-0.3-dev \
            libgbm-dev \
            libegl-dev \
            libwayland-dev \
            libdrm-dev

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      # O10 audit: tag, src-tauri/tauri.conf.json:version, and
      # package.json:version must agree. Otherwise the built binary
      # self-identifies as one version while the GitHub release name
      # claims another.
      - name: Verify version consistency
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          conf=$(node -p "require('./src-tauri/tauri.conf.json').version")
          pkg=$(node -p "require('./package.json').version")
          echo "tag=$tag conf=$conf pkg=$pkg"
          if [ "$tag" != "$conf" ] || [ "$tag" != "$pkg" ]; then
            echo "::error::version drift — tag=$tag, tauri.conf.json=$conf, package.json=$pkg"
            exit 1
          fi

      # Tag pushes do not run ci.yml, so release artifacts need their own
      # admission gates before the packaging action receives write access.
      - name: Frontend unit tests
        run: npm test

      - name: TypeScript type check
        run: npm run typecheck

      - name: npm audit (all dependencies, high+)
        run: npm audit --audit-level=high

      - name: Frontend build
        run: npx vite build

      - name: Rust formatting
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

      - name: Rust lint
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "WordBuddy ${{ github.ref_name }}"
          releaseBody: "See the [WordBuddy README](https://github.com/Frostbite1536/WordBuddy/blob/main/README.md) for features, platform support, and current limitations."
          releaseDraft: true
          prerelease: false
