name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch pin

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - name: Install system dependencies (Linux)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libxdo-dev \
            libasound2-dev \
            libpipewire-0.3-dev \
            libgbm-dev \
            libegl-dev \
            libwayland-dev \
            libdrm-dev

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Frontend unit tests (vitest)
        run: npm test


      - name: Frontend build
        run: npx vite build

      # D10 audit: gate on `npm audit` so transitive vulnerabilities
      # surface at PR time. Production deps only — dev-dep advisories
      # are a noisier feed and rarely matter for a Tauri desktop app.
      # `--audit-level=high` keeps the bar at "must fix" so daily
      # PRs aren't blocked by churn-level moderate findings.
      - name: npm audit (production deps, high+)
        run: npm audit --audit-level=high --omit=dev

      - name: Rust check
        working-directory: src-tauri
        run: cargo check

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

      # D10 audit: cargo-audit walks Cargo.lock against the RustSec
      # advisory database. Catches transitive RUSTSECs (the openssl /
      # rustls-webpki cases that reached the lockfile silently). Only
      # runs on Linux because cargo-install is fastest there and the
      # advisory DB is identical across platforms — no need to spend
      # 3× CI minutes.
      - name: Install cargo-audit
        if: matrix.platform == 'ubuntu-latest'
        run: cargo install --locked cargo-audit --version 0.22.2
      - name: cargo audit
        if: matrix.platform == 'ubuntu-latest'
        working-directory: src-tauri
        run: cargo audit
